<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filing Copilot</title>
<style>
  :root{
    --bg:#F4F5F7; --panel:#FFFFFF; --panel2:#F3F5F8; --card:#FFFFFF; --chip:#EEF1F5;
    --line:#E5E8EE; --line2:#D8DCE4; --ink:#1B2430; --mut:#57616F; --dim:#8B94A1;
    --accent:#2B57C4; --accent-soft:#EAF0FC; --accent2:#178A57; --green-soft:#E7F3ED;
    --violet:#4E48A8; --violet-soft:#ECEBF6; --amber:#8A6410; --amber-soft:#F6EFDC; --navy:#1E3A6E;
    --mono:'SFMono-Regular',Menlo,Consolas,monospace;
    --sh:0 1px 2px rgba(20,30,50,.05),0 1px 3px rgba(20,30,50,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:264px 1fr 336px;grid-template-rows:56px 1fr;height:100vh}
  .top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:650;font-size:15px}
  .logo{width:28px;height:28px;border-radius:7px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
  .switcher{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 13px;font-size:13px;box-shadow:var(--sh)}
  .switcher .cap{color:var(--dim);font-size:10.5px;font-weight:600;letter-spacing:.5px;margin-right:2px}
  .top-right{display:flex;align-items:center;gap:16px;color:var(--mut);font-size:12.5px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}
  .rail{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:16px 12px}
  .rail h4{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin:16px 6px 8px;font-weight:650}
  .rail h4:first-child{margin-top:2px}
  .filing{padding:10px 11px;border-radius:8px;border:1px solid transparent;margin-bottom:5px;cursor:pointer;transition:.12s}
  .filing:hover{background:var(--panel2)}
  .filing.active{background:var(--accent-soft);border-color:#CFDDF6}
  .filing .co{font-weight:600;font-size:13px}.filing.active .co{color:var(--accent)}
  .filing .meta{color:var(--dim);font-size:11.5px;margin-top:2px}
  .tree{font-size:13px}
  .tnode{padding:5px 8px;border-radius:6px;color:var(--mut);cursor:pointer;display:flex;gap:8px;align-items:center}
  .tnode:hover{background:var(--panel2);color:var(--ink)}
  .tnode.lvl2{margin-left:6px;font-size:12.5px}
  .tnode.on{background:var(--accent-soft);color:var(--accent);font-weight:600;border-left:2px solid var(--accent)}
  .tdot{width:5px;height:5px;border-radius:50%;background:var(--line2);flex-shrink:0}.tnode.on .tdot{background:var(--accent)}
  .center{display:flex;flex-direction:column;min-height:0}
  .chat{overflow-y:auto;padding:24px 34px 18px;display:flex;flex-direction:column;gap:22px;flex:1}
  .msg{max-width:770px}.msg.user{align-self:flex-end}
  .bubble-u{background:var(--accent);color:#fff;padding:10px 15px;border-radius:12px 12px 4px 12px;font-weight:500;box-shadow:var(--sh)}
  .who{font-size:11px;color:var(--dim);margin:0 4px 6px;font-weight:600;letter-spacing:.4px}
  .bubble-a{background:var(--panel);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:15px 17px;box-shadow:var(--sh)}
  .bubble-a p{margin:0 0 10px}.bubble-a p:last-child{margin-bottom:0}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px;align-items:center}
  .badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:6px;border:1px solid transparent}
  .b-retrieve{background:var(--accent-soft);color:var(--accent);border-color:#D3E0F7}
  .b-analyze{background:var(--violet-soft);color:var(--violet);border-color:#DCDAF0}
  .b-sandbox{background:var(--amber-soft);color:var(--amber);border-color:#EADFC2}
  .b-eval{background:var(--green-soft);color:var(--accent2);border-color:#CDE7DA}
  .cite{font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid #D3E0F7;border-radius:6px;padding:3px 9px;font-family:var(--mono)}
  .artifact{margin-top:13px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--sh)}
  .art-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .art-title{font-size:12.5px;font-weight:650}.art-kind{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .art-body{padding:14px 16px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;font-family:var(--mono)}
  th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left;color:var(--mut);font-family:-apple-system,sans-serif}
  th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  tr:last-child td{border-bottom:none}
  .art-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--mut)}
  .link{color:var(--accent);cursor:pointer;font-size:11.5px;font-weight:500}.link:hover{text-decoration:underline}
  .compute{border-top:1px solid var(--line);padding:13px 14px;background:#FAFBFC;display:none}.compute.open{display:block}
  .codebox{font-family:var(--mono);font-size:11.5px;color:#3B4658;line-height:1.7;white-space:pre-wrap;margin:0}
  .composer{padding:14px 34px 20px;border-top:1px solid var(--line);background:var(--panel)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
  .chip{font-size:12.5px;color:var(--mut);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  .cbox{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 15px;box-shadow:var(--sh)}
  .cbox input{flex:1;background:none;border:none;color:var(--ink);font-size:14px;outline:none}
  .send{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer}.send:hover{background:#2149A8}
  .evid{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 16px}
  .evid h4{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin:0 0 11px;font-weight:650}
  .evid .hint{color:var(--mut);font-size:13px}
  .trace{display:flex;flex-direction:column;gap:1px;margin-bottom:16px}
  .step{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;font-size:12.5px}
  .tick{width:17px;height:17px;border-radius:50%;background:var(--green-soft);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;margin-top:1px;font-weight:700}
  .step .lbl{color:var(--ink);font-weight:550}.step .sub{color:var(--dim);font-size:11.5px}
  .sandbar{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--mut);font-family:var(--mono);background:var(--amber-soft);border:1px solid #EADFC2;border-radius:7px;padding:8px 11px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .ingest-btn{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid #D3E0F7;border-radius:6px;padding:4px 9px;cursor:pointer}
  .modal-wrap{position:fixed;inset:0;background:rgba(27,36,48,.34);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal-wrap.hidden{display:none}
  .modal{width:620px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 24px 60px rgba(20,30,50,.22);overflow:hidden}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--line)}
  .modal-head .t{font-size:16px;font-weight:650}
  .mclose{color:var(--dim);cursor:pointer;font-size:16px;padding:3px 8px;border-radius:6px}.mclose:hover{background:var(--panel2);color:var(--ink)}
  .modal-body{padding:20px 22px}
  .ingest-form{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:650}
  .inp{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);font-family:var(--mono);min-width:110px;outline:none}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .stage{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.stage:last-child{border-bottom:none}
  .sicon{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px;font-weight:700}
  .s-done{background:var(--green-soft);color:var(--accent2)}.s-run{background:var(--accent-soft);color:var(--accent)}.s-wait{background:var(--panel2);color:var(--dim)}
  .stage .slbl{font-weight:600;font-size:13.5px}.stage .ssub{font-size:12px;color:var(--dim);margin-top:2px;font-family:var(--mono)}
  .spin{width:13px;height:13px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pipe-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);font-family:var(--mono)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">FC</div> Filing Copilot</div>
    <div class="switcher"><span class="cap">FILING</span> <span id="activeName">—</span></div>
    <div class="top-right"><span id="idxCount">—</span><div class="avatar">VP</div></div>
  </div>
  <div class="rail">
    <h4 style="display:flex;align-items:center;justify-content:space-between">Corpus <span class="ingest-btn" id="ingestOpen">+ Ingest</span></h4>
    <div id="corpus"></div>
    <h4>Document Outline · <span style="color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600">PageIndex</span></h4>
    <div class="tree" id="tree"></div>
  </div>
  <div class="center">
    <div class="chat" id="chat"></div>
    <div class="composer">
      <div class="chips" id="chips">
        <span class="chip" data-q="What are the main risk factors this company calls out?">Main risk factors?</span>
        <span class="chip" data-q="How has operating margin trended over the recent fiscal years?">Operating-margin trend?</span>
        <span class="chip" data-q="What is revenue growth — YoY and CAGR — over the available years?">Revenue growth (YoY + CAGR)?</span>
        <span class="chip" data-q="Show the balance-sheet ratios (current ratio, debt-to-equity) over recent years.">Balance-sheet ratios?</span>
      </div>
      <div class="cbox"><input id="ask" placeholder="Ask about the filing, or ask for an analysis on its data…"><button class="send" id="sendBtn">Ask →</button></div>
    </div>
  </div>
  <div class="evid" id="evid"><h4>Evidence &amp; trace</h4><div class="hint">Ask a question — analysis answers show their agent trace and generated code here.</div></div>
</div>

<div class="modal-wrap hidden" id="ingestModal">
  <div class="modal">
    <div class="modal-head"><span class="t">Ingest a filing</span><span class="mclose" id="ingestClose">✕</span></div>
    <div class="modal-body">
      <div class="ingest-form">
        <div class="field"><label>Ticker</label><input class="inp" id="inTicker" value="AAPL" style="min-width:90px"></div>
        <div class="field"><label>Form</label><input class="inp" id="inForm" value="10-K" style="min-width:80px"></div>
        <button class="send" id="runIngest">Fetch &amp; index →</button>
      </div>
      <div id="pipeWrap" style="display:none"><div id="stages"></div><div class="pipe-foot" id="pipeFoot"></div></div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), chat=$('#chat'), evid=$('#evid');
const esc=t=>String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let filings=[], current=null;

async function api(path, opts){ const r=await fetch(path, opts); return r.json(); }

async function loadFilings(){
  filings = await api('/filings');
  $('#idxCount').textContent = filings.length+' filing'+(filings.length===1?'':'s')+' indexed';
  $('#corpus').innerHTML = filings.map(f=>
    `<div class="filing" data-id="${f.id}"><div class="co">${esc(f.company)}</div><div class="meta">${esc(f.ticker)} · ${esc(f.form)} · ${esc(f.period||'')}</div></div>`).join('')
    || '<div class="meta" style="color:var(--dim);padding:6px">No filings yet — click “+ Ingest”.</div>';
  document.querySelectorAll('#corpus .filing').forEach(el=>el.onclick=()=>selectFiling(+el.dataset.id));
  if(filings.length && !current) selectFiling(filings[0].id);
}
async function selectFiling(id){
  current=id;
  const f=filings.find(x=>x.id===id);
  $('#activeName').textContent = f? `${f.company} · ${f.form} · ${f.period||''}` : '—';
  document.querySelectorAll('#corpus .filing').forEach(el=>el.classList.toggle('active', +el.dataset.id===id));
  const o=await api(`/filings/${id}/outline`);
  $('#tree').innerHTML = o.nodes.map(n=>
    `<div class="tnode lvl2" data-t="${esc(n.title)}"><span class="tdot"></span>${esc(n.item)} — ${esc(n.title)}</div>`).join('');
  document.querySelectorAll('#tree .tnode').forEach(el=>el.onclick=()=>ask(`What does the "${el.dataset.t}" section cover?`));
}

function badges(r){
  let b='<div class="badges">';
  if(r.mode==='analyze'){
    b+=`<span class="badge b-analyze">Analyzed · skill: ${esc(r.skill||'')}</span>`;
    b+=`<span class="badge b-sandbox">Ran in Docker sandbox</span>`;
  } else { b+=`<span class="badge b-retrieve">Retrieved · tree navigation</span>`; }
  if(r.citation) b+=`<span class="cite">${esc(r.citation)}</span>`;
  b+=`<span class="badge b-eval">✓ ${r.mode==='analyze'?'numbers trace to source':'grounded'}</span></div>`;
  return b;
}
function artifactHtml(r){
  if(!r.artifact||!r.artifact.columns) return '';
  const a=r.artifact;
  const head='<tr>'+a.columns.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';
  const body=(a.rows||[]).map(row=>'<tr>'+row.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('');
  const code = r.code? `<div class="art-foot"><span>skill: <b style="color:var(--violet)">${esc(r.skill)}</b></span><span class="link viewcomp">View computation ▾</span></div><div class="compute"><pre class="codebox">${esc(r.code)}</pre></div>`:'';
  return `<div class="artifact"><div class="art-head"><span class="art-title">${esc(a.summary||'Result')}</span><span class="art-kind">artifact · table</span></div><div class="art-body"><table>${head}${body}</table></div>${code}</div>`;
}
function renderTrace(r){
  const steps=(r.trace||[]).map(s=>`<div class="step"><span class="tick">✓</span><div><div class="lbl">${esc(s.label)}</div><div class="sub">${esc(s.sub)}</div></div></div>`).join('');
  const sand = r.mode==='analyze' ? '<div class="sandbar"><span class="dot"></span>python:3.11-slim · --network none · 512MB · 35s cap</div>':'';
  evid.innerHTML=`<h4>Agent trace</h4><div class="trace">${steps}</div>${sand}`;
}

async function ask(q){
  if(!current){ return; }
  chat.insertAdjacentHTML('beforeend',
    `<div class="msg user"><div class="bubble-u">${esc(q)}</div></div>
     <div class="msg" id="pending"><div class="who">FILING COPILOT</div><div class="bubble-a"><p style="color:var(--mut)">Thinking…</p></div></div>`);
  chat.scrollTop=chat.scrollHeight;
  let r;
  try{ r=await api('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filing_id:current,question:q})}); }
  catch(e){ r={mode:'retrieve',answer:'Request failed: '+e,trace:[]}; }
  const pend=$('#pending'); pend.removeAttribute('id');
  pend.querySelector('.bubble-a').innerHTML = `<p>${esc(r.answer)}</p>${artifactHtml(r)}${badges(r)}`;
  renderTrace(r);
  chat.scrollTop=chat.scrollHeight;
}
document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>ask(c.dataset.q));
$('#sendBtn').onclick=()=>{const v=$('#ask').value.trim(); if(v){ask(v); $('#ask').value='';}};
$('#ask').addEventListener('keydown',e=>{if(e.key==='Enter')$('#sendBtn').click();});
chat.addEventListener('click',e=>{ if(e.target.classList.contains('viewcomp')){
  const c=e.target.closest('.artifact').querySelector('.compute'); const open=c.classList.toggle('open');
  e.target.textContent=open?'Hide computation ▴':'View computation ▾';
}});

/* ingest */
const modal=$('#ingestModal');
$('#ingestOpen').onclick=()=>{modal.classList.remove('hidden'); $('#pipeWrap').style.display='none';};
$('#ingestClose').onclick=()=>modal.classList.add('hidden');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.add('hidden');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.add('hidden');});
const STAGES=['Fetch from SEC EDGAR','Parse document','Build PageIndex tree','Extract data tables','Persist to Postgres'];
$('#runIngest').onclick=async()=>{
  const ticker=$('#inTicker').value.trim(), form=$('#inForm').value.trim()||'10-K';
  $('#pipeWrap').style.display='block';
  $('#stages').innerHTML=STAGES.map(s=>`<div class="stage"><div class="sicon s-run"><div class="spin"></div></div><div><div class="slbl">${s}</div></div></div>`).join('');
  $('#pipeFoot').textContent='indexing '+ticker+' '+form+'… (this runs the real pipeline: fetch + summarize + extract)';
  try{
    const res=await api('/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker,form})});
    if(res.id){
      document.querySelectorAll('#stages .sicon').forEach(ic=>{ic.className='sicon s-done';ic.textContent='✓';});
      $('#pipeFoot').innerHTML=`✓ indexed · ${res.nodes} sections · ${res.datasets} datasets → <b style="color:var(--accent)">postgres</b>`;
      await loadFilings(); selectFiling(res.id);
      setTimeout(()=>modal.classList.add('hidden'),1200);
    } else { $('#pipeFoot').textContent='Ingest failed: '+(res.detail||JSON.stringify(res)); }
  }catch(e){ $('#pipeFoot').textContent='Ingest failed: '+e; }
};

loadFilings();
</script>
</body>
</html>
